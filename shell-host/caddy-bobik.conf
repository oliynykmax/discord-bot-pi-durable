# Gives Caddy SHELL_TOKEN for the memory route's bearer check. The packaged unit runs `caddy run --environ`, which
# prints the whole environment to the journal, so ExecStart is repeated without it.
[Service]
EnvironmentFile=/etc/bobik/shell.env
ExecStart=
ExecStart=/usr/bin/caddy run --config /etc/caddy/Caddyfile
